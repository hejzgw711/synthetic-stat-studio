<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>ny正在迭代牛逼功能，敬请期待</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #edf3f1; color-scheme: light; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; color: #1f302d; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    main { width: min(100%, 620px); padding: clamp(28px, 6vw, 56px); border: 1px solid #ccdcd7; border-radius: 16px; background: white; text-align: center; box-shadow: 0 16px 48px #173d3010; }
    .status-dot { display: block; width: 12px; height: 12px; margin: 0 auto 24px; border-radius: 50%; background: #177f6b; box-shadow: 0 0 0 8px #e8f4ef; }
    h1 { margin: 0; font-size: clamp(21px, 4vw, 28px); font-weight: 650; line-height: 1.7; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main role="status">
    <span class="status-dot" aria-hidden="true"></span>
    <h1>ny正在迭代牛逼功能，敬请期待</h1>
  </main>
</body>
</html>
